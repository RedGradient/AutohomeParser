services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autohome}
      POSTGRES_USER: ${POSTGRES_USER:-autohome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autohome}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    command:
      - postgres
      - -c
      - max_wal_size=8GB
      - -c
      - min_wal_size=2GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 1gb
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autohome}:${POSTGRES_PASSWORD:-autohome}@postgres:5432/${POSTGRES_DB:-autohome}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autohome}:${POSTGRES_PASSWORD:-autohome}@postgres:5432/${POSTGRES_DB:-autohome}
      API_USERNAME: ${API_USERNAME:-autohome}
      API_PASSWORD: ${API_PASSWORD:-autohome}
      API_JWT_SECRET: ${API_JWT_SECRET:-development-only-autohome-jwt-secret-change-me}
      API_JWT_TTL_SECONDS: ${API_JWT_TTL_SECONDS:-3600}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    init: true
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "autohome.celery_app:app", "worker", "--loglevel=INFO", "--concurrency=1"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autohome}:${POSTGRES_PASSWORD:-autohome}@postgres:5432/${POSTGRES_DB:-autohome}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "autohome.celery_app:app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CBR_RATES_UPDATE_HOUR: ${CBR_RATES_UPDATE_HOUR:-8}
      CBR_RATES_UPDATE_MINUTE: ${CBR_RATES_UPDATE_MINUTE:-0}
    depends_on:
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped

  parser:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "autohome.cli.run_multi"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autohome}:${POSTGRES_PASSWORD:-autohome}@127.0.0.1:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-autohome}
      DATABASE_BATCH_SIZE: ${DATABASE_BATCH_SIZE:-1000}
    network_mode: host
    user: "${PARSER_UID:-1000}:${PARSER_GID:-1000}"
    volumes:
      - ./data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    stop_grace_period: ${SHUTDOWN_TIMEOUT:-120}s
    profiles: ["parser"]

volumes:
  postgres_data:
