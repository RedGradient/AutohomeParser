services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autohome}
      POSTGRES_USER: ${POSTGRES_USER:-autohome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autohome}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 1gb
    restart: unless-stopped

volumes:
  postgres_data:
