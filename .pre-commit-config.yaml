repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff — форматирование
        entry: .venv/bin/ruff format
        language: system
        types: [python]
        require_serial: true
      - id: ruff-check
        name: Ruff — проверка и автокоррекция
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
        require_serial: true
