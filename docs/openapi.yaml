openapi: 3.1.0
info:
  title: Autohome Catalog API
  version: 1.0.0
  description: |
    Read-only API for the Autohome vehicle catalog and precomputed customs
    calculations. Monetary catalog values are expressed in CNY. Decimal values
    are serialized as strings to preserve precision.
servers:
  - url: /api/v1
tags:
  - name: Brands
  - name: Series
  - name: Modifications
  - name: Specs
  - name: Gallery
  - name: Customs

paths:
  /brands:
    get:
      tags: [Brands]
      summary: List brands
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/ManufacturerId'
        - $ref: '#/components/parameters/IsNewEnergy'
        - $ref: '#/components/parameters/PriceFrom'
        - $ref: '#/components/parameters/PriceTo'
        - name: sort
          in: query
          schema: { type: string, enum: [name, series_count, min_price], default: name }
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated brands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandPage' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /brands/{brand_id}:
    get:
      tags: [Brands]
      summary: Get a brand
      parameters:
        - $ref: '#/components/parameters/BrandIdPath'
      responses:
        '200':
          description: Brand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Brand' }
        '404': { $ref: '#/components/responses/NotFound' }

  /series:
    get:
      tags: [Series]
      summary: List vehicle series
      description: Technical and price filters must match the same spec within a series.
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/BrandId'
        - $ref: '#/components/parameters/ManufacturerId'
        - $ref: '#/components/parameters/IsNewEnergy'
        - $ref: '#/components/parameters/State'
        - $ref: '#/components/parameters/YearFrom'
        - $ref: '#/components/parameters/YearTo'
        - $ref: '#/components/parameters/EnergyType'
        - $ref: '#/components/parameters/BodyType'
        - $ref: '#/components/parameters/DriveType'
        - $ref: '#/components/parameters/TransmissionType'
        - $ref: '#/components/parameters/EngineDisplacementFrom'
        - $ref: '#/components/parameters/EngineDisplacementTo'
        - $ref: '#/components/parameters/PowerHpFrom'
        - $ref: '#/components/parameters/PowerHpTo'
        - $ref: '#/components/parameters/PriceFrom'
        - $ref: '#/components/parameters/PriceTo'
        - $ref: '#/components/parameters/PriceType'
        - name: sort
          in: query
          schema: { type: string, enum: [name, price, year], default: name }
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesPage' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /series/{series_id}:
    get:
      tags: [Series]
      summary: Get a vehicle series
      parameters:
        - $ref: '#/components/parameters/SeriesIdPath'
      responses:
        '200':
          description: Vehicle series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '404': { $ref: '#/components/responses/NotFound' }

  /series/{series_id}/modifications:
    get:
      tags: [Modifications]
      summary: List modifications belonging to one series
      parameters:
        - $ref: '#/components/parameters/SeriesIdPath'
        - $ref: '#/components/parameters/YearFrom'
        - $ref: '#/components/parameters/YearTo'
        - $ref: '#/components/parameters/EnergyType'
        - $ref: '#/components/parameters/BodyType'
        - $ref: '#/components/parameters/DriveType'
        - $ref: '#/components/parameters/TransmissionType'
        - $ref: '#/components/parameters/EngineDisplacementFrom'
        - $ref: '#/components/parameters/EngineDisplacementTo'
        - $ref: '#/components/parameters/PowerHpFrom'
        - $ref: '#/components/parameters/PowerHpTo'
        - $ref: '#/components/parameters/PriceFrom'
        - $ref: '#/components/parameters/PriceTo'
        - $ref: '#/components/parameters/PriceType'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Modifications whose modifications.series_id equals series_id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModificationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /series/{series_id}/photos:
    get:
      tags: [Gallery]
      summary: List photos of a series
      parameters:
        - $ref: '#/components/parameters/SeriesIdPath'
        - name: spec_id
          in: query
          schema: { type: integer }
        - name: category_id
          in: query
          schema: { type: integer }
        - name: color_scope
          in: query
          schema: { type: string, enum: [EXTERIOR, INTERIOR] }
        - name: color_id
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated gallery photos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /series/{series_id}/gallery-colors:
    get:
      tags: [Gallery]
      summary: List gallery colors of a series
      parameters:
        - $ref: '#/components/parameters/SeriesIdPath'
        - name: color_scope
          in: query
          schema: { type: string, enum: [EXTERIOR, INTERIOR] }
      responses:
        '200':
          description: Gallery colors
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GalleryColor' }
        '404': { $ref: '#/components/responses/NotFound' }

  /modifications:
    get:
      tags: [Modifications]
      summary: List modifications
      parameters:
        - $ref: '#/components/parameters/SeriesId'
        - $ref: '#/components/parameters/BrandId'
        - $ref: '#/components/parameters/YearFrom'
        - $ref: '#/components/parameters/YearTo'
        - $ref: '#/components/parameters/EnergyType'
        - $ref: '#/components/parameters/BodyType'
        - $ref: '#/components/parameters/DriveType'
        - $ref: '#/components/parameters/TransmissionType'
        - $ref: '#/components/parameters/EngineDisplacementFrom'
        - $ref: '#/components/parameters/EngineDisplacementTo'
        - $ref: '#/components/parameters/PowerHpFrom'
        - $ref: '#/components/parameters/PowerHpTo'
        - $ref: '#/components/parameters/PriceFrom'
        - $ref: '#/components/parameters/PriceTo'
        - $ref: '#/components/parameters/PriceType'
        - name: is_complete
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema: { type: string, enum: [year, power, engine_displacement, price, name], default: year }
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated modifications
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModificationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /modifications/{modification_id}:
    get:
      tags: [Modifications]
      summary: Get a modification
      parameters:
        - $ref: '#/components/parameters/ModificationIdPath'
      responses:
        '200':
          description: Modification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Modification' }
        '404': { $ref: '#/components/responses/NotFound' }

  /modifications/{modification_id}/specs:
    get:
      tags: [Specs]
      summary: List specs belonging to a modification
      parameters:
        - $ref: '#/components/parameters/ModificationIdPath'
        - $ref: '#/components/parameters/PriceFrom'
        - $ref: '#/components/parameters/PriceTo'
        - $ref: '#/components/parameters/PriceType'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated specs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /specs:
    get:
      tags: [Specs]
      summary: List vehicle specs (trim levels)
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/BrandId'
        - $ref: '#/components/parameters/SeriesId'
        - $ref: '#/components/parameters/ModificationId'
        - $ref: '#/components/parameters/ManufacturerId'
        - $ref: '#/components/parameters/YearFrom'
        - $ref: '#/components/parameters/YearTo'
        - $ref: '#/components/parameters/State'
        - name: config_available
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/EnergyType'
        - $ref: '#/components/parameters/BodyType'
        - $ref: '#/components/parameters/DriveType'
        - $ref: '#/components/parameters/TransmissionType'
        - $ref: '#/components/parameters/EngineDisplacementFrom'
        - $ref: '#/components/parameters/EngineDisplacementTo'
        - $ref: '#/components/parameters/PowerHpFrom'
        - $ref: '#/components/parameters/PowerHpTo'
        - name: seats_from
          in: query
          schema: { type: integer, minimum: 1 }
        - name: seats_to
          in: query
          schema: { type: integer, minimum: 1 }
        - name: four_wheel_drive
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/PriceFrom'
        - $ref: '#/components/parameters/PriceTo'
        - $ref: '#/components/parameters/PriceType'
        - name: sort
          in: query
          schema: { type: string, enum: [price, year, power, engine_displacement, name], default: price }
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated specs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecPage' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /specs/{spec_id}:
    get:
      tags: [Specs]
      summary: Get a vehicle spec
      parameters:
        - $ref: '#/components/parameters/SpecIdPath'
      responses:
        '200':
          description: Vehicle spec
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpecDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /specs/{spec_id}/parameters:
    get:
      tags: [Specs]
      summary: Get grouped configuration parameters of a spec
      parameters:
        - $ref: '#/components/parameters/SpecIdPath'
        - name: group_id
          in: query
          schema: { type: integer }
        - name: section_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Parameter groups
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ParameterGroup' }
        '404': { $ref: '#/components/responses/NotFound' }

  /customs-calculations:
    get:
      tags: [Customs]
      summary: List precomputed customs calculations
      parameters:
        - name: spec_id
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/BrandId'
        - $ref: '#/components/parameters/SeriesId'
        - name: importer_type
          in: query
          schema: { $ref: '#/components/schemas/ImporterType' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CalculationStatus' }
        - name: calculation_date_from
          in: query
          schema: { type: string, format: date }
        - name: calculation_date_to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated calculations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomsCalculationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /customs-calculations/{calculation_id}:
    get:
      tags: [Customs]
      summary: Get a precomputed customs calculation and its payments
      parameters:
        - name: calculation_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Customs calculation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomsCalculation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /specs/{spec_id}/customs-calculations:
    get:
      tags: [Customs]
      summary: List precomputed customs calculations for a spec
      parameters:
        - $ref: '#/components/parameters/SpecIdPath'
        - name: importer_type
          in: query
          schema: { $ref: '#/components/schemas/ImporterType' }
        - name: calculation_date
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated calculations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomsCalculationPage' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    Search:
      name: q
      in: query
      description: Case-insensitive name search
      schema: { type: string, minLength: 1, maxLength: 200 }
    BrandId:
      name: brand_id
      in: query
      schema: { type: integer }
    BrandIdPath:
      name: brand_id
      in: path
      required: true
      schema: { type: integer }
    SeriesId:
      name: series_id
      in: query
      schema: { type: integer }
    SeriesIdPath:
      name: series_id
      in: path
      required: true
      schema: { type: integer }
    ModificationId:
      name: modification_id
      in: query
      schema: { type: integer }
    ModificationIdPath:
      name: modification_id
      in: path
      required: true
      schema: { type: integer }
    SpecIdPath:
      name: spec_id
      in: path
      required: true
      schema: { type: integer }
    ManufacturerId:
      name: manufacturer_id
      in: query
      schema: { type: integer }
    IsNewEnergy:
      name: is_new_energy
      in: query
      schema: { type: boolean }
    State:
      name: state
      in: query
      schema: { type: integer }
    YearFrom:
      name: year_from
      in: query
      schema: { type: integer, minimum: 1900, maximum: 2200 }
    YearTo:
      name: year_to
      in: query
      schema: { type: integer, minimum: 1900, maximum: 2200 }
    EnergyType:
      name: energy_type
      in: query
      schema: { type: string }
    BodyType:
      name: body_type
      in: query
      schema: { type: string }
    DriveType:
      name: drive_type
      in: query
      schema: { type: string }
    TransmissionType:
      name: transmission_type
      in: query
      schema: { type: string }
    EngineDisplacementFrom:
      name: engine_displacement_from
      in: query
      description: Minimum engine displacement in millilitres
      schema: { type: integer, minimum: 0 }
    EngineDisplacementTo:
      name: engine_displacement_to
      in: query
      description: Maximum engine displacement in millilitres
      schema: { type: integer, minimum: 0 }
    PowerHpFrom:
      name: power_hp_from
      in: query
      schema: { $ref: '#/components/schemas/NonNegativeDecimal' }
    PowerHpTo:
      name: power_hp_to
      in: query
      schema: { $ref: '#/components/schemas/NonNegativeDecimal' }
    PriceFrom:
      name: price_from
      in: query
      description: Inclusive minimum vehicle price in CNY
      schema: { $ref: '#/components/schemas/Money' }
    PriceTo:
      name: price_to
      in: query
      description: Inclusive maximum vehicle price in CNY
      schema: { $ref: '#/components/schemas/Money' }
    PriceType:
      name: price_type
      in: query
      description: Effective price uses positive guide price, otherwise positive dealer price
      schema: { type: string, enum: [effective, guide, dealer], default: effective }
    Order:
      name: order
      in: query
      schema: { type: string, enum: [asc, desc], default: asc }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the previous response
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid filter, range or cursor
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Money:
      type: string
      pattern: '^\d+(\.\d{1,2})?$'
      examples: ['229800.00']
    NonNegativeDecimal:
      type: string
      pattern: '^\d+(\.\d+)?$'
    Pagination:
      type: object
      required: [limit, has_more]
      properties:
        limit: { type: integer }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    Price:
      type: object
      properties:
        guide_cny: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        dealer_cny: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        discount_cny: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        effective_cny: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        source: { type: string, enum: [GUIDE, DEALER, MISSING] }
    PriceRange:
      type: object
      properties:
        min_cny: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        max_cny: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
    BrandRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    SeriesRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    ModificationRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    ManufacturerRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    Brand:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        logo_url: { type: [string, 'null'], format: uri }
        series_count: { type: [integer, 'null'] }
        price: { $ref: '#/components/schemas/PriceRange' }
    Series:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        brand: { oneOf: [{ $ref: '#/components/schemas/BrandRef' }, { type: 'null' }] }
        manufacturer: { oneOf: [{ $ref: '#/components/schemas/ManufacturerRef' }, { type: 'null' }] }
        is_new_energy: { type: [boolean, 'null'] }
        state: { type: [integer, 'null'] }
        spec_count: { type: [integer, 'null'] }
        price: { $ref: '#/components/schemas/PriceRange' }
        official_images:
          type: array
          items: { $ref: '#/components/schemas/PhotoPreview' }
    Modification:
      type: object
      required: [id, series_id, name, spec_count, is_complete]
      properties:
        id: { type: integer }
        series_id: { type: integer }
        model_year: { type: [integer, 'null'] }
        name: { type: string }
        energy_type: { type: [string, 'null'] }
        engine_summary: { type: [string, 'null'] }
        engine_displacement_ml: { type: [integer, 'null'] }
        engine_power_kw: { type: [string, 'null'] }
        engine_power_hp: { type: [string, 'null'] }
        transmission_summary: { type: [string, 'null'] }
        transmission_type: { type: [string, 'null'] }
        drive_type: { type: [string, 'null'] }
        body_type: { type: [string, 'null'] }
        battery_capacity_kwh: { type: [string, 'null'] }
        is_complete: { type: boolean }
        spec_count: { type: integer }
        price: { $ref: '#/components/schemas/PriceRange' }
    Powertrain:
      type: object
      properties:
        energy_type: { type: [string, 'null'] }
        engine_summary: { type: [string, 'null'] }
        engine_displacement_ml: { type: [integer, 'null'] }
        engine_power_kw: { type: [string, 'null'] }
        engine_power_hp: { type: [string, 'null'] }
        maximum_power_kw: { type: [string, 'null'] }
        transmission_summary: { type: [string, 'null'] }
        transmission_type: { type: [string, 'null'] }
        drive_type: { type: [string, 'null'] }
        motor_total_power_kw: { type: [string, 'null'] }
        motor_total_power_hp: { type: [string, 'null'] }
        battery_capacity_kwh: { type: [string, 'null'] }
        battery_type: { type: [string, 'null'] }
    VehicleAttributes:
      type: object
      properties:
        vehicle_class: { type: [string, 'null'] }
        vehicle_technical_category: { type: [string, 'null'] }
        body_type: { type: [string, 'null'] }
        body_construction: { type: [string, 'null'] }
        seat_count_min: { type: [integer, 'null'] }
        seat_count_max: { type: [integer, 'null'] }
        door_count: { type: [integer, 'null'] }
        curb_mass_kg: { type: [integer, 'null'] }
        gross_mass_kg: { type: [integer, 'null'] }
        length_mm: { type: [integer, 'null'] }
        width_mm: { type: [integer, 'null'] }
        height_mm: { type: [integer, 'null'] }
        wheelbase_mm: { type: [integer, 'null'] }
        is_four_wheel_drive: { type: [boolean, 'null'] }
    Spec:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        year: { type: [integer, 'null'] }
        state: { type: [integer, 'null'] }
        brand: { oneOf: [{ $ref: '#/components/schemas/BrandRef' }, { type: 'null' }] }
        series: { oneOf: [{ $ref: '#/components/schemas/SeriesRef' }, { type: 'null' }] }
        modification: { oneOf: [{ $ref: '#/components/schemas/ModificationRef' }, { type: 'null' }] }
        price: { $ref: '#/components/schemas/Price' }
        description: { type: [string, 'null'] }
        image_url: { type: [string, 'null'], format: uri }
        config_available: { type: [boolean, 'null'] }
        powertrain: { oneOf: [{ $ref: '#/components/schemas/Powertrain' }, { type: 'null' }] }
    SpecDetail:
      allOf:
        - $ref: '#/components/schemas/Spec'
        - type: object
          properties:
            vehicle_attributes: { oneOf: [{ $ref: '#/components/schemas/VehicleAttributes' }, { type: 'null' }] }
    Parameter:
      type: object
      required: [id, semantic_key, name]
      properties:
        id: { type: integer }
        semantic_key: { type: string }
        name: { type: string }
        value: { type: [string, 'null'] }
        option_price_cny: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        video_url: { type: [string, 'null'], format: uri }
        subitems:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              value: { type: [boolean, 'null'] }
              option_price_cny: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
    ParameterSection:
      type: object
      required: [id, name, parameters]
      properties:
        id: { type: integer }
        name: { type: string }
        parameters:
          type: array
          items: { $ref: '#/components/schemas/Parameter' }
    ParameterGroup:
      type: object
      required: [id, name, sections]
      properties:
        id: { type: integer }
        name: { type: string }
        sections:
          type: array
          items: { $ref: '#/components/schemas/ParameterSection' }
    GalleryColor:
      type: object
      required: [series_id, color_scope, color_id, name, color_values]
      properties:
        series_id: { type: integer }
        color_scope: { type: string, enum: [EXTERIOR, INTERIOR] }
        color_id: { type: integer }
        name: { type: string }
        color_values:
          type: array
          items: { type: string }
        picture_count: { type: [integer, 'null'] }
        gallery_url: { type: string, format: uri }
    Photo:
      type: object
      required: [id, series_id, category_id, category_name, image_url, page_url]
      properties:
        id: { type: integer }
        series_id: { type: integer }
        spec_id: { type: [integer, 'null'] }
        category_id: { type: integer }
        category_name: { type: string }
        title: { type: [string, 'null'] }
        image_url: { type: string, format: uri }
        thumbnail_url: { type: [string, 'null'], format: uri }
        page_url: { type: string, format: uri }
        colors:
          type: array
          items: { $ref: '#/components/schemas/GalleryColor' }
    PhotoPreview:
      type: object
      required: [id, image_url]
      properties:
        id: { type: integer }
        title: { type: [string, 'null'] }
        image_url: { type: string, format: uri }
        thumbnail_url: { type: [string, 'null'], format: uri }
    ImporterType:
      type: string
      enum: [INDIVIDUAL, LEGAL_ENTITY]
    CalculationStatus:
      type: string
      enum: [CALCULATED, MISSING_DATA, UNSUPPORTED, MANUAL_REVIEW]
    ClassificationStatus:
      type: string
      enum: [CLASSIFIED, NOT_REQUIRED, AMBIGUOUS, MISSING_DATA, UNSUPPORTED, MANUAL_REVIEW]
    CustomsPayment:
      type: object
      required: [payment_type, status]
      properties:
        payment_type: { type: string, examples: [IMPORT_DUTY] }
        amount_rub: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        status: { $ref: '#/components/schemas/CalculationStatus' }
        rule_code: { type: [string, 'null'] }
        details: { type: object, additionalProperties: true }
    CustomsCalculation:
      type: object
      required: [id, spec_id, importer_type, calculation_date, rules_version, status, classification_status, payments]
      properties:
        id: { type: integer }
        spec_id: { type: integer }
        importer_type: { $ref: '#/components/schemas/ImporterType' }
        calculation_date: { type: string, format: date }
        rules_version: { type: string }
        price_source: { type: string, enum: [GUIDE, DEALER, MISSING, NOT_REQUIRED] }
        vehicle_price_cny: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        customs_value_rub: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        energy_type: { type: [string, 'null'] }
        body_type: { type: [string, 'null'] }
        engine_displacement_ml: { type: [integer, 'null'] }
        tnved_code: { type: [string, 'null'] }
        classification_status: { $ref: '#/components/schemas/ClassificationStatus' }
        status: { $ref: '#/components/schemas/CalculationStatus' }
        warnings:
          type: array
          items: { type: object, additionalProperties: true }
        payments:
          type: array
          items: { $ref: '#/components/schemas/CustomsPayment' }
        total_rub: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        is_total_complete: { type: boolean }
    BrandPage:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Brand' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    SeriesPage:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Series' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    ModificationPage:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Modification' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    SpecPage:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Spec' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    PhotoPage:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Photo' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    CustomsCalculationPage:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CustomsCalculation' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
