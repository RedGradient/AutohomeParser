services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-autohome_test}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-autohome_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-autohome_test}
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=2g
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 2s
      timeout: 3s
      retries: 30
    shm_size: 256mb
    restart: "no"
